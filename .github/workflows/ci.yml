name: CI

# Shared checks for pull requests, main and pinned site builds.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      commit:
        description: Source commit to check
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check:search-seo
      - run: bun run check
      - run: bun test tests/
      - run: bun server/main.ts --self-check
