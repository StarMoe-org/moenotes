name: CI

# Checks on every push to main and every pull request. The deploy server dispatches build-site.yml
# for rendering and publishing; this workflow validates the installation and scheduling protocols offline.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check:search-seo
      - run: bun run check
      - run: bun test tests/github-build.test.ts tests/site-artifact.test.ts tests/site-release-build.test.ts tests/build-store-ci.test.ts
      - run: bun server/main.ts --self-check
