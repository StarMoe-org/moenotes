# git-cliff configuration: GitHub release notes from conventional commits.
# https://git-cliff.org/docs/configuration

[changelog]
header = ""
body = """
{%- macro commit_link(id) -%}
[{{ id | truncate(length=7, end="") }}](https://github.com/StarMoe-org/moenotes/commit/{{ id }})
{%- endmacro -%}
{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}](https://github.com/StarMoe-org/moenotes/compare/{{ previous.version }}...{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}](https://github.com/StarMoe-org/moenotes/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
          {% if commit.breaking %}[**breaking**] {% endif %}\
          {{ commit.message | split(pat="\n") | first | trim | upper_first }} ({{ self::commit_link(id=commit.id) }})\
    {% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
# Commits from before Conventional Commits were required are listed under "Other changes".
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
commit_preprocessors = [
    # link issue / pull request numbers
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/StarMoe-org/moenotes/issues/${2}))" },
]
commit_parsers = [
    { message = "^Merge ", skip = true },
    { message = "^feat", group = "<!-- 00 -->Features" },
    { message = "^fix", group = "<!-- 01 -->Bug fixes" },
    { message = "^perf", group = "<!-- 02 -->Performance" },
    { message = "^refactor", group = "<!-- 03 -->Refactoring" },
    { message = "^doc", group = "<!-- 04 -->Documentation" },
    { message = "^test", group = "<!-- 05 -->Tests" },
    { message = "^build", group = "<!-- 06 -->Build" },
    { message = "^ci", group = "<!-- 07 -->CI" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", group = "<!-- 08 -->Miscellaneous" },
    { message = "^style", group = "<!-- 08 -->Miscellaneous" },
    { message = "^revert", group = "<!-- 09 -->Reverts" },
    { body = ".*security", group = "<!-- 10 -->Security" },
    { message = ".*", group = "<!-- 11 -->Other changes" },
]

[bump]
# 0.x: breaking changes and features bump the minor version, everything else the patch version.
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
