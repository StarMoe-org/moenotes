<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Moenotes — coral stamp tile + cream "M" + sakura dot -->
  <defs>
    <clipPath id="tile">
      <rect x="14" y="14" width="100" height="100" rx="28" />
    </clipPath>
  </defs>

  <!-- drop shadow -->
  <rect x="14" y="20" width="100" height="100" rx="28" fill="#2B2A27" opacity="0.16" />

  <!-- coral tile -->
  <rect x="14" y="14" width="100" height="100" rx="28" fill="#E87461" />

  <!-- depth band -->
  <g clip-path="url(#tile)">
    <rect x="14" y="86" width="100" height="42" fill="#C85A47" opacity="0.4" />
  </g>

  <!-- M monogram (bold stroke) -->
  <path d="M38 90 V46 L64 76 L90 46 V90"
        fill="none" stroke="#FFFBF5" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round" />

  <!-- ink border -->
  <rect x="14" y="14" width="100" height="100" rx="28" fill="none" stroke="#2B2A27" stroke-width="6" />

  <!-- sakura accent (top-right) -->
  <g transform="translate(98 30)">
    <g fill="#F5C4C4" stroke="#2B2A27" stroke-width="3" stroke-linejoin="round">
      <circle cx="0" cy="-9" r="6.2" />
      <circle cx="8.6" cy="-2.8" r="6.2" />
      <circle cx="5.3" cy="7.3" r="6.2" />
      <circle cx="-5.3" cy="7.3" r="6.2" />
      <circle cx="-8.6" cy="-2.8" r="6.2" />
    </g>
    <circle cx="0" cy="0" r="3" fill="#FBE3DC" stroke="#2B2A27" stroke-width="2" />
  </g>
</svg>
