<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>组卡：技能等级（手机）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.mn{--mn-bg:#EEF2FA;--mn-surface:rgba(247,250,255,.94);--mn-surface-strong:#F7FAFF;--mn-glass:rgba(247,250,255,.86);--mn-glass-border:rgba(163,183,219,.52);--mn-text:#202E4C;--mn-ink-soft:#3D506F;--mn-muted:#596B87;--mn-border:#C5D1E6;--mn-cream-deep:#E3EAF7;--mn-accent:#5475BC;--mn-accent-deep:#395EA8;--mn-accent-soft:#E1EAFB;--mn-on-accent:#FFFFFF;--mn-pink:#C3B8EC;--mn-pink-soft:#EEE9FA;--mn-cyan:#A0DDEA;--mn-amber:#EAD0A6;--mn-peach:#F8D3B8;--mn-yellow:#F7E9AD;--mn-mint:#B9D5B1;--mn-mint-deep:#3F5740;--mn-mint-soft:#E4EBDD;--mn-warn-soft:#FBF1DC;--mn-warn-ink:#6E4A12;--mn-font:"Inter","PingFang SC","Microsoft YaHei",ui-sans-serif,system-ui,sans-serif;--mn-mono:"SFMono-Regular",Consolas,monospace}
.mn[data-theme="dark"]{--mn-bg:#080F21;--mn-surface:rgba(16,27,49,.94);--mn-surface-strong:#17243E;--mn-glass:rgba(13,23,43,.9);--mn-glass-border:rgba(146,182,233,.22);--mn-text:#EAF1FF;--mn-ink-soft:#D2DDF3;--mn-muted:#A0B0CD;--mn-border:#2C3D5E;--mn-cream-deep:#17243F;--mn-accent:#9ACBFA;--mn-accent-deep:#B2D8FF;--mn-accent-soft:#1C3453;--mn-on-accent:#080F21;--mn-pink:#C4BAF1;--mn-pink-soft:#29233F;--mn-cyan:#9ADAE9;--mn-amber:#EDCE95;--mn-peach:#F0C4A4;--mn-yellow:#F6E79E;--mn-mint:#94C78B;--mn-mint-deep:#99D3B1;--mn-mint-soft:#182F32;--mn-warn-soft:#3A2E17;--mn-warn-ink:#F3D9A4}
a{color:var(--mn-accent-deep)}a:hover{color:var(--mn-accent)}
</style>
</helmet>
<div class="mn" data-theme="{{theme}}" style="width: 390px; min-height: 1280px; position: relative; background: var(--mn-bg); color: var(--mn-text); font-family: var(--mn-font); font-size: 14px; line-height: 1.5">

<header style="height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--mn-glass-border); background: var(--mn-glass)">
<a href="Goal.dc.html" aria-label="返回目标与歌曲" style="width: 44px; height: 44px; display: grid; place-items: center; color: var(--mn-text)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<span style="font-weight: 650">技能等级</span>
<span style="flex-grow: 1"></span>
<span style="font-size: 13px; color: var(--mn-muted); font-family: var(--mn-mono)">{{filled}} / {{count}}</span>
</header>

<div style="padding: 14px 16px 130px; display: flex; flex-direction: column; gap: 12px">
<div>
<h1 style="margin: 0; font-size: 20px; font-weight: 700">还需要 {{count}} 张的技能等级</h1>
<p style="margin: 4px 0 0; font-size: 13px; color: var(--mn-muted)">只问会影响这次推荐的卡，填完存进你的卡池。在游戏里看卡片详情的技能页即可。</p>
</div>

<div style="display: flex; gap: 8px">
<button type="button" onClick="{{fill1}}" style="flex: 1 1 0; min-height: 44px; border-radius: 10px; border: 1px solid var(--mn-border); background: var(--mn-surface-strong); color: var(--mn-text); font: inherit; cursor: pointer">全部 Lv1</button>
<button type="button" onClick="{{fill5}}" style="flex: 1 1 0; min-height: 44px; border-radius: 10px; border: 1px solid var(--mn-border); background: var(--mn-surface-strong); color: var(--mn-text); font: inherit; cursor: pointer">全部 Lv5</button>
</div>

<div style="border-radius: 3px 20px 3px 20px; background: var(--mn-surface); border: 1px solid var(--mn-glass-border); padding: 4px 14px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="9">
<div style="padding: 12px 0; border-top: {{c.sep}}; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 40px; height: 40px; border-radius: 4px 12px 4px 12px; background: {{c.fill}}; flex-shrink: 0"></span>
<span style="min-width: 0; flex-grow: 1"><span style="display: block; font-weight: 600">{{c.name}} <span style="font-weight: 400; font-size: 12px; color: var(--mn-muted)">{{c.card}}</span></span><span style="display: block; font-size: 12px; color: var(--mn-muted)">影响约 {{c.impact}} 分</span></span>
</div>
<div role="radiogroup" aria-label="{{c.name}} 技能等级" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{c.live}}" as="b" hint-placeholder-count="5">
<button type="button" role="radio" aria-checked="{{b.on}}" onClick="{{b.pick}}" style="height: 44px; border-radius: 10px; border: {{b.border}}; background: {{b.bg}}; color: {{b.fg}}; font: inherit; font-weight: 600; cursor: pointer">Lv{{b.n}}</button>
</sc-for>
</div>
</div>
</sc-for>
</div>
<p style="margin: 0; font-size: 12px; color: var(--mn-muted)">撃奏技能默认与普通相同；不同的卡，到“我的卡池”里修正那张卡。</p>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; background: var(--mn-glass); border-top: 1px solid var(--mn-glass-border); display: flex; flex-direction: column; gap: 6px">
<a href="Mobile.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 50px; border-radius: 12px; background: var(--mn-accent-deep); color: var(--mn-on-accent); text-decoration: none; font-weight: 600">{{cta}}</a>
<sc-if value="{{hasMissing}}" hint-placeholder-val="{{true}}"><span style="font-size: 12px; color: var(--mn-muted); text-align: center">还有 {{missing}} 张没填，结果会是区间</span></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":1280}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var defs = [
      { id: 'c', name: '角色 C', card: '[卡名]', fill: 'var(--mn-amber)', impact: '41,300' },
      { id: 'b', name: '角色 B', card: '[卡名]', fill: 'var(--mn-cyan)', impact: '36,900' },
      { id: 'g', name: '角色 G', card: '[卡名]', fill: 'var(--mn-pink-soft)', impact: '33,100' },
      { id: 'd', name: '角色 D', card: '[卡名]', fill: 'var(--mn-mint)', impact: '28,400' },
      { id: 'a', name: '角色 A', card: '[卡名]', fill: 'var(--mn-pink)', impact: '22,700' },
      { id: 'f', name: '角色 F', card: '[卡名]', fill: 'var(--mn-yellow)', impact: '19,800' },
      { id: 'e', name: '角色 E', card: '[卡名]', fill: 'var(--mn-peach)', impact: '17,200' },
      { id: 'h', name: '角色 H', card: '[卡名]', fill: 'var(--mn-cyan)', impact: '12,600' },
      { id: 'i', name: '角色 I', card: '[卡名]', fill: 'var(--mn-amber)', impact: '9,400' }
    ];
    var lv = this.state.lv;
    if (!lv) { lv = {}; defs.forEach(function (d) { if (d.prev) lv[d.id] = d.prev; }); }
    var filled = 0;
    var cards = defs.map(function (d, i) {
      var cur = lv[d.id];
      if (cur) filled += 1;
      return Object.assign({}, d, {
        sep: i === 0 ? '0' : '1px solid var(--mn-border)',
        live: [1, 2, 3, 4, 5].map(function (n) {
          var on = cur === n;
          return {
            n: n, on: on,
            border: on ? '2px solid var(--mn-accent-deep)' : '1px solid var(--mn-border)',
            bg: on ? 'var(--mn-accent-deep)' : 'var(--mn-surface-strong)',
            fg: on ? 'var(--mn-on-accent)' : 'var(--mn-text)',
            pick: function () { var o = Object.assign({}, lv); o[d.id] = n; self.setState({ lv: o }); }
          };
        })
      });
    });
    var all = function (n) { var o = {}; defs.forEach(function (d) { o[d.id] = n; }); self.setState({ lv: o }); };
    var missing = defs.length - filled;
    return {
      theme: this.props.theme || 'light',
      cards: cards, count: defs.length, filled: filled,
      missing: missing, hasMissing: missing > 0,
      cta: missing > 0 ? '先看结果' : '完成，看结果',
      fill1: function () { all(1); },
      fill5: function () { all(5); }
    };
  }
}
</script>
</body>
</html>
